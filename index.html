<style>
:root{--red:#ED1C24;--red2:#8A0F14;--yel:#FFE600;--blk:#0A0A0A;--bg:#FFE600;--card:#fff;--ink:#0A0A0A;--mut:#4d3a2a;--line:#0A0A0A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#140c0c;--card:#241616;--ink:#FFF3B0;--mut:#d6b9a0;--line:#FFE600}}
:root[data-theme=dark]{--bg:#140c0c;--card:#241616;--ink:#FFF3B0;--mut:#d6b9a0;--line:#FFE600}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:600 15px/1.45 Nunito,system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:'Bowlby One',Impact,sans-serif;font-weight:400;margin:0;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 110px}
.top{background:var(--red);color:#fff;position:sticky;top:0;z-index:5;border-bottom:4px solid var(--yel)}

const D=dayOrders();return`<button class="btn sm alt" data-a="rback">‹ ${mlabel(adm.rm)}</button><div class="box" style="margin-top:12px"><h3 style="font-size:20px">${adm.rd} ${mlabel(adm.rm)}</h3><div class="muted">${D.length} pesanan · penjualan lunas ${rm(sum(D))}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn sm" data-a="pday">🖨 Print semua nota</button><button class="btn sm alt" data-a="hday">Unduh nota (HTML)</button></div></div>`+D.map(o=>`<div class="box"><div class="row" style="border:0"><span class="st ${o.type=="dine"?"nw":"wt"}">${typ(o)}</span><span class="muted">${ftm(o.ts)}</span></div>${nota(o)}<button class="btn sm" data-a="pnota" data-v="${o.id}">🖨 Print nota</button></div>`).join("")}

function aord(){const all=[...S.orders].sort((a,b)=>b.ts-a.ts),n=all.filter(o=>ps(o)=="review").length,L=adm.of=="rev"?all.filter(o=>ps(o)=="review"):adm.of=="unp"?all.filter(o=>["unpaid","rejected"].includes(ps(o))):all;
const cur=S.orders,hdr=`<div class="box"><div class="row" style="border:0"><b>Periode berjalan</b><span class="muted">${cur.length?fdt(Math.min(...cur.map(o=>o.ts)))+" – sekarang":"Belum ada pesanan"}</span></div><div class="muted">${cur.length} pesanan · ${sold(cur).length} lunas</div><div class="row" style="border:0"><span class="tot">${rm(sum(cur))}</span><button class="btn sm" data-a="closem">Tutup bulan dan export Excel</button></div></div>`;const f=`<div class="chips">${[["all","Semua ("+all.length+")"],["rev","Perlu verifikasi ("+n+")"],["unp","Belum bayar"]].map(x=>`<button class="chip ${adm.of==x[0]?"on":""}" data-a="aof" data-v="${x[0]}">${x[1]}</button>`).join("")}</div>`;
return hdr+f+(L.length?L.map(o=>`<div class="box ord"><div class="row" style="border:0"><b>${o.id} · ${o.type=="dine"?"Meja "+o.table:"Take away"}</b><span><span class="st ${stc(o)}">${PSL[ps(o)]}</span> <span class="st wt">${o.status}</span></span></div><div class="muted">${esc(o.name||"Tanpa nama")} ${esc(o.phone)} · ${esc(pmGet(o.pm).name)} · ${new Date(o.ts).toLocaleString("id-ID")}</div>${items(o.items)}${o.note?`<p class="muted">Catatan: ${esc(o.note)}</p>`:""}${o.proof&&o.proof!="kasir"?`<img class="pf" src="${o.proof}" alt="Bukti bayar ${o.id}" data-a="zoom">`:o.proof=="kasir"?'<p class="muted">Bukti bayar ditunjukkan langsung ke kasir.</p>':""}<div class="row" style="border:0"><span class="tot">${rm(o.total)}</span><span style="display:flex;gap:6px;flex-wrap:wrap">${ps(o)=="paid"?"":`<button class="btn sm" data-a="apaid" data-v="${o.id}">Verifikasi lunas</button>`}${ps(o)=="review"?`<button class="btn sm alt" data-a="arej" data-v="${o.id}">Tolak bukti</button>`:""}<button class="btn sm alt" data-a="ast" data-v="${o.id}">${o.status=="Baru"?"Proses":o.status=="Diproses"?"Selesai":"Selesai ✓"}</button></span></div></div>`).join(""):'<div class="box">Tidak ada pesanan di filter ini.</div>')}
function apay(){const s=S.set;return`<div class="box"><h3 style="font-size:18px">QRIS</h3><p class="muted">Unggah desain QRIS aslimu. Customer melihat gambar ini saat memilih QRIS.</p><div class="up"><img class="qr" style="margin:0;width:150px;height:auto;object-fit:contain;background:#fff;${s.qris?"":"display:none"}" ${s.qris?`src="${s.qris}"`:""} alt="QRIS saat ini"><div class="upc"><input type="file" id="qf" accept="image/png,image/jpeg,image/webp" aria-label="Upload QRIS"><div class="muted">JPG, PNG, atau WebP · maks. 2 MB · pakai gambar tajam agar mudah di-scan.</div>${s.qris?'<button class="btn sm alt" data-a="qdel" style="margin-top:8px">Hapus QRIS</button>':'<div class="muted">Belum ada QRIS. Customer melihat QR contoh.</div>'}</div></div></div><h3 style="margin:16px 0 8px;font-size:18px">Bank dan dompet digital</h3>`+s.methods.map((m,i)=>`<div class="box"><div style="display:flex;align-items:center;gap:12px">${badge(m)}<b style="flex:1">${esc(m.name)}</b><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-a="mon" data-v="${i}" ${m.on?"checked":""}> Aktif</label></div><label class="f" for="ma${i}">Nomor rekening / akun</label><input type="text" id="ma${i}" value="${esc(m.acc)}" inputmode="numeric"><label class="f" for="mh${i}">Atas nama</label><input type="text" id="mh${i}" value="${esc(m.holder)}"><label class="f">Logo (opsional)</label><input type="file" data-logo="${i}" accept="image/png,image/jpeg,image/webp" aria-label="Upload logo ${esc(m.name)}"><div class="muted">Unggah logo resmi · maks. 2 MB · tampil persegi.</div><div style="height:10px"></div><button class="btn sm" data-a="msave" data-v="${i}">Simpan</button></div>`).join("")}
const badge=m=>m.logo?`<span class="lg"><img src="${m.logo}" alt=""></span>`:`<span class="lg" style="background:${m.c||"#fff"};color:${m.t||"#000"}">${m.ab||"?"}</span>`;
const pmList=()=>[{id:"qris",name:"QRIS",kind:"Scan dan bayar",ab:"QRIS",c:"#0A0A0A",t:"#FFE600"},...S.set.methods.filter(m=>m.on),{id:"kasir",name:"Bayar di kasir",kind:"Tunai atau kartu",ab:"💵"}];
const pmGet=id=>pmList().find(m=>m.id==id)||S.set.methods.find(m=>m.id==id)||{id,name:id};
function payBlock(o){const s=ps(o),m=pmGet(o.pm),has=o.proof&&o.proof!="kasir";
if(s=="paid")return'<div class="box">✅ Pembayaran sudah diverifikasi kasir. Selamat menikmati!</div>';
if(s=="review")return`<div class="box">⏳ ${has?"Bukti bayar terkirim.":"Kamu akan menunjukkan bukti bayar ke kasir."} Status jadi lunas setelah kasir memverifikasi.</div>${has?`<img class="pf" src="${o.proof}" alt="Bukti bayar">`:""}`;
if(o.pm=="kasir")return`<div class="box">Tunjukkan kode <b>${o.id}</b> ke kasir dan bayar ${rm(o.total)}. Status jadi lunas setelah kasir memverifikasi.</div>`;
let h=s=="rejected"?'<div class="box" style="border-color:var(--red)">Bukti bayar ditolak kasir. Kirim ulang bukti yang jelas atau tunjukkan ke kasir.</div>':"";
if(o.pm=="qris")h+=S.set.qris?`<img class="qr" src="${S.set.qris}" alt="QRIS Ayam Gepuk Republik" style="width:min(100%,300px);height:auto;object-fit:contain;background:#fff">`:`<canvas class="qr" id="qr" width="25" height="25" aria-label="QRIS contoh"></canvas><p class="muted" style="text-align:center">QRIS contoh. Admin belum mengunggah QRIS asli.</p>`;
else h+=`<div class="box" style="display:flex;gap:12px;align-items:center">${badge(m)}<div><b>${esc(m.name)}</b><br>${m.acc?`<span class="tot">${esc(m.acc)}</span> <button class="btn sm alt" data-a="copy" data-v="${esc(m.acc)}">Salin</button><br><span class="muted">a.n. ${esc(m.holder||"-")}</span>`:'<span class="muted">Rekening belum diisi admin.</span>'}</div></div>`;
return h+`<p>Bayar <b>${rm(o.total)}</b>, lalu kirim bukti bayar:</p><input type="file" id="pff" accept="image/png,image/jpeg,image/webp" aria-label="Upload bukti bayar"><div class="muted">JPG, PNG, atau WebP · maks. 2 MB</div><div id="pfp"></div><button class="btn" id="pfs" data-a="sendproof" data-v="${o.id}" style="margin-top:10px" disabled>Kirim bukti bayar</button><button class="btn alt" style="margin-top:10px" data-a="tocashier" data-v="${o.id}">Tunjukkan bukti ke kasir</button>`}
function img2url(f,max,type,q,cb){if(!/^image\/(png|jpeg|webp)$/.test(f.type))return toast("Format harus JPG, PNG, atau WebP");if(f.size>2*1024*1024)return toast("Ukuran gambar maksimal 2 MB");
const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext("2d");if(type=="image/jpeg"){x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL(type,q))};{const fr=new FileReader();fr.onload=()=>{im.src=fr.result};fr.readAsDataURL(f)}}
function readImg(f){if(!/^image\/(png|jpeg|webp)$/.test(f.type))return toast("Format harus JPG, PNG, atau WebP");if(f.size>2*1024*1024)return toast("Ukuran gambar maksimal 2 MB");
const im=new Image();im.onload=()=>{if(im.width<400||im.height<500)return toast("Resolusi minimal 400×500 px");adm.im=im;adm.z=1;adm.fx=adm.fy=.5;adm.dirty=true;$("#cc").hidden=false;$("#zm").value=1;$("#fx").value=.5;$("#fy").value=.5;pv()};{const fr=new FileReader();fr.onload=()=>{im.src=fr.result};fr.readAsDataURL(f)}}
function crop(c){const im=adm.im,x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);if(!im){x.fillStyle="#999";x.font="bold 30px sans-serif";x.textAlign="center";x.fillText("Foto 4:5",c.width/2,c.height/2);return}
let w,h;if(im.width/im.height>.8){h=im.height;w=h*.8}else{w=im.width;h=w/.8}w/=adm.z;h/=adm.z;x.drawImage(im,(im.width-w)*adm.fx,(im.height-h)*adm.fy,w,h,0,0,c.width,c.height)}
function pv(){const c=$("#cv");if(!c)return;crop(c);const i=$("#inf");if(i&&adm.im)i.textContent=`Sumber ${adm.im.width}×${adm.im.height} px → hasil 640×800 px`}
function post(){if(!adm.ok)return;drawDlg();if(adm.tab=="menu"){if(adm.img&&!adm.im){const i=new Image();i.onload=()=>{adm.im=i;pv()};i.src=adm.img}pv()}}
const rst=()=>{adm.edit=null;adm.img="";adm.im=null;adm.dirty=false;adm.z=1;adm.fx=adm.fy=.5};
const grab=i=>{const m=S.set.methods[i];m.acc=$("#ma"+i).value.trim();m.holder=$("#mh"+i).value.trim()};
/* ===== ACTIONS ===== */
const ord=id=>S.orders.find(o=>o.id==id);
const act={rmo:d=>{adm.rm=d.v;adm.rd=0;refresh("rep");scrollTo(0,0)},rd:d=>{adm.rd=+d.v;refresh("rep");scrollTo(0,0)},rback:()=>{if(adm.rd)adm.rd=0;else adm.rm="";refresh("rep");scrollTo(0,0)},
pnota:d=>{const o=dayOrders().find(x=>x.id==d.v);if(o)doPrint(nota(o))},pday:()=>doPrint(dayOrders().map(nota).join("")),hday:()=>{saveHtml(dayOrders().map(nota).join(""),`Nota-${adm.rm}-${pad(adm.rd)}.html`)},
xlm:d=>{const f=xl(S.arch[d.v].orders);saveFile(f.name,f.data)},
closem:()=>{const L=S.orders,u=L.filter(o=>ps(o)!="paid").length;if(!L.length)return toast("Belum ada pesanan untuk diexport");ask("Tutup bulan dan export?",`${L.length} pesanan akan diexport ke Excel, lalu dipindahkan ke arsip Report Monthly Sales. Daftar pesanan dikosongkan untuk periode baru.${u?` ${u} pesanan belum lunas ikut diarsipkan dengan status terakhirnya.`:""}`,"closeok","","Export dan mulai baru")},
closeok:()=>{adm.dlg=null;drawDlg();exportClose()},dlgno:()=>{adm.dlg=null;drawDlg()},dlgbg:(d,b,e)=>{if(e.target===b){adm.dlg=null;drawDlg()}},
delok:d=>{adm.dlg=null;drawDlg();S.menu=S.menu.filter(x=>x.id!=d.v);save();toast("Menu dihapus");refresh("menu")},
copy:d=>{navigator.clipboard.writeText(d.v).then(()=>toast("Nomor disalin"),()=>toast("Salin manual: "+d.v))},
sendproof:d=>{if(!pend)return toast("Pilih gambar bukti bayar dulu");const o=ord(d.v);if(!o)return;o.proof=pend;o.ps="review";pend="";save();toast("Bukti bayar terkirim. Menunggu verifikasi kasir");render()},
tocashier:d=>{const o=ord(d.v);if(!o)return;o.proof="kasir";o.ps="review";save();toast("Tunjukkan bukti bayar ke kasir");render()},
reset:()=>{cu.started=false;sheet=null;render()},logout:()=>{adm.ok=false;try{sessionStorage.removeItem("agr_adm")}catch(e){}render()},aof:d=>{adm.of=d.v;refresh("ord")},
arej:d=>{const o=ord(d.v);if(!o)return;o.ps="rejected";save();toast("Bukti ditolak");refresh("ord","rep")},qdel:()=>{S.set.qris="";save();refresh("pay")},
msave:d=>{grab(d.v);save();toast("Tersimpan")},mon:d=>{const m=S.set.methods[d.v];m.on=!m.on;save();refresh("pay")},zoom:(d,b)=>b.classList.toggle("big"),
clrimg:()=>{adm.im=null;adm.img="";adm.dirty=false;$("#cc").hidden=true;pv()},type:d=>{cu.type=d.v;render()},table:d=>{cu.table=+d.v;render()},
start:()=>{cu.name=$("#nm").value.trim();cu.phone=$("#ph").value.trim();if(cu.type=="dine"&&!cu.table)return toast("Pilih nomor meja dulu");cu.started=true;render()},
tab:d=>{cu.tab=d.v;render()},cat:d=>{cu.cat=d.v;cu.q="";document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.dataset.v==cu.cat));const q=$("#q");if(q)q.value="";$("#grid").innerHTML=grid()},
add:d=>{cu.cart[d.v]=(cu.cart[d.v]||0)+1;upd(d.v)},sub:d=>{if(--cu.cart[d.v]<=0)delete cu.cart[d.v];if(!count()&&sheet=="cart")sheet=null;upd(d.v)},
cart:()=>{sheet="cart";drawSheet()},close:()=>{sheet=null;drawSheet()},bg:(d,b,e)=>{if(e.target===b){sheet=null;drawSheet()}},
pm:d=>{cu.pm=d.v;saveCu();drawSheet(true)},review:()=>{const m=pmGet(cu.pm);if(!["qris","kasir"].includes(cu.pm)&&!m.acc)return toast("Rekening "+m.name+" belum diisi admin. Pilih metode lain.");sheet="review";drawSheet()},confirm:()=>{pend="";mkOrder();render()},open:d=>{pend="";sheet={o:d.v};drawSheet()},

login:()=>{if($("#pin").value=="1234"){adm.ok=true;try{sessionStorage.setItem("agr_adm","1")}catch(e){}render()}else toast("PIN salah. Coba lagi.")},atab:d=>{if(adm.tab=="menu"&&d.v!="menu"){rst();adm.stale.menu=1}adm.tab=d.v;showTab();scrollTo(0,0)},
apaid:d=>{const o=ord(d.v);if(!o)return;o.ps="paid";o.paid=true;save();toast("Pembayaran diverifikasi");refresh("ord","rep")},ast:d=>{const o=ord(d.v);if(!o)return;o.status=o.status=="Baru"?"Diproses":"Selesai";save();refresh("ord")},
edit:d=>{rst();adm.edit=d.v;adm.img=S.menu.find(x=>x.id==d.v).img;refresh("menu");scrollTo(0,0)},cancel:()=>{rst();refresh("menu")},
tgl:d=>{const m=S.menu.find(x=>x.id==d.v);if(!m)return;m.on=!m.on;save();refresh("menu")},del:d=>{const m=S.menu.find(x=>x.id==d.v);if(m)ask("Hapus menu?",m.name+" akan dihapus dari menu customer.","delok",d.v,"Hapus")},
saveitem:()=>{const n=$("#mn").value.trim(),p=parseFloat($("#mp").value);if(!n||isNaN(p))return toast("Isi nama dan harga menu");
if(adm.im&&adm.dirty){const c=document.createElement("canvas");c.width=640;c.height=800;crop(c);adm.img=c.toDataURL("image/jpeg",.82)}
const v={cat:$("#mc").value,name:n,desc:$("#md").value.trim(),price:p,img:adm.img};
const cur=adm.edit&&S.menu.find(x=>x.id==adm.edit);if(cur)Object.assign(cur,v);else S.menu.push({id:"m"+Date.now(),on:true,...v});
save();toast(adm.edit?"Menu diperbarui":"Menu ditambahan".replace("ambahan","ambahkan"));rst();refresh("menu")}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&act[b.dataset.a])act[b.dataset.a](b.dataset,b,e)});
document.addEventListener("input",e=>{if(e.target.id=="q"){cu.q=e.target.value;$("#grid").innerHTML=grid()}if(e.target.id=="nt")cu.note=e.target.value;if(e.target.id=="nm")cu.name=e.target.value;if(e.target.id=="ph")cu.phone=e.target.value});
document.addEventListener("change",e=>{const t=e.target,f=t.files&&t.files[0];if(!f)return;
if(t.id=="imgf")readImg(f);
else if(t.id=="pff")img2url(f,1000,"image/jpeg",.8,u=>{pend=u;$("#pfp").innerHTML=`<img class="pf big" src="${u}" alt="Pratinjau bukti bayar">`;$("#pfs").disabled=false});
else if(t.id=="qf")img2url(f,1000,"image/jpeg",.92,u=>{S.set.qris=u;save();refresh("pay");toast("QRIS diperbarui")});
else if(t.dataset.logo!=null){const i=+t.dataset.logo;img2url(f,200,"image/png",1,u=>{grab(i);S.set.methods[i].logo=u;save();refresh("pay");toast("Logo diperbarui")})}});
document.addEventListener("input",e=>{const i=e.target.id;if(i=="zm"||i=="fx"||i=="fy"){adm[i=="zm"?"z":i]=+e.target.value;adm.dirty=true;pv()}});
addEventListener("hashchange",render);
addEventListener("storage",e=>{if(e.key!="agr1"||!e.newValue)return;try{S=JSON.parse(e.newValue)}catch(x){return}S.set=S.set||defSet();S.arch=S.arch||{};
if(isAdm()){if(adm.ok&&$("#ap")){adm.stale.ord=adm.stale.rep=1;showTab()}}else if(!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||""))render()});
render();
</script></body></html>
